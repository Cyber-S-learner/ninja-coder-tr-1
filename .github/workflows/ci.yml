name: Restaurant CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Login To Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t cyberslearner/restaurant-backend ./backend

      - name: Build Frontend Image
        run: |
          docker build -t cyberslearner/restaurant-frontend ./frontend

      - name: Push Backend Image
        run: |
          docker push cyberslearner/restaurant-backend

      - name: Push Frontend Image
        run: |
          docker push cyberslearner/restaurant-frontend